# Step 1 — run from this folder:
#   docker compose up -d --build
#
# Services: mysql (data), redis (cache + queues), api, queue (worker)
# Then start the frontend (step 2) in ../frontend-legacy-vue2

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: legacy_products
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - legacy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - legacy_shared

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - legacy_shared

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      legacy_shared:
        aliases:
          - api

  queue:
    build: .
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    networks:
      - legacy_shared

volumes:
  legacy_mysql_data:

networks:
  legacy_shared:
    name: legacy_shared
    driver: bridge
